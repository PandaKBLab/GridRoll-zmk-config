CONFIG_ZMK_KEYBOARD_NAME="GridRoll"
CONFIG_BT_DEVICE_NAME="GridRoll"
CONFIG_USB_DEVICE_PRODUCT="GridRoll"
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_POINTING=y
# User default for all Studio-enabled GridRoll builds: editing needs no unlock.
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_USB_DEVICE_MANUFACTURER="PandaKB"
# Standard shared ZMK HID identity; custom UF2 loader has a separate test identity.
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E
