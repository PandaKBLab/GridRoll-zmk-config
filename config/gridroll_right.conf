CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
# Keep the host connection on the widely supported BLE 1M PHY.
CONFIG_BT_CTLR_PHY_2M=n
# Prefer a 7.5 ms host interval without skipped connection events. The host
# decides the negotiated values; connected-idle current may increase.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0
CONFIG_GRIDROLL_PAW3222_BLE_REPORT_INTERVAL_MS=8
# Runtime processor rotation uses the complete C math library.
CONFIG_NEWLIB_LIBC=y
CONFIG_STATIC_INIT_GNU=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y
CONFIG_GRIDROLL_USB_AUTO_OUTPUT=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
