name: Build GridRoll firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tooling bundled in the pinned build image
        run: |
          python3 -c 'import intelhex, yaml, grpc_tools; print("Pinned build tooling ready")'
          west --version
      - name: Verify input and motion regression tests
        run: |
          python3 scripts/check_hardware.py
          python3 scripts/keymap_docs.py --check
          python3 scripts/test_precision.py
          cc -Wall -Wextra -Werror -std=c11 -Idrivers/studio tests/test_studio_discovery.c -o /tmp/test-studio-discovery
          /tmp/test-studio-discovery
          cc -Wall -Wextra -Werror -std=c11 -Idrivers/status tests/test_status_policy.c -o /tmp/test-status-policy
          /tmp/test-status-policy
          cc -Wall -Wextra -Werror -std=c11 -Idrivers/usb tests/test_usb_output.c -o /tmp/test-usb-output
          /tmp/test-usb-output
          cc -Wall -Wextra -Werror -std=c11 -Idrivers/input tests/test_sdio.c drivers/input/paw3222_sdio.c -o /tmp/test-sdio
          /tmp/test-sdio
          cc -Wall -Wextra -Werror -std=c11 -Idrivers/input tests/test_orientation.c -o /tmp/test-orientation
          /tmp/test-orientation
          cc -Wall -Wextra -Werror -std=c11 -Idrivers/input tests/test_batch.c -o /tmp/test-batch
          /tmp/test-batch
      - name: Fetch locked firmware dependencies
        run: |
          mkdir -p /tmp/gridroll-workspace/config
          mkdir -p artifacts
          cp config/west.yml /tmp/gridroll-workspace/config/west.yml
          west init -l /tmp/gridroll-workspace/config
          cd /tmp/gridroll-workspace
          west update --narrow --fetch-opt=--filter=blob:none
          west manifest --freeze > "$GITHUB_WORKSPACE/artifacts/west-frozen.yml"
      - name: Check pinned DYA Studio extension wire compatibility
        run: python3 scripts/check_studio_protocols.py --workspace /tmp/gridroll-workspace
      - name: Apply and test temporary mouse-layer lifetime fixes
        run: |
          git -C /tmp/gridroll-workspace/zmk-module-runtime-input-processor apply --check "$GITHUB_WORKSPACE/patches/runtime-temp-layer.patch"
          git -C /tmp/gridroll-workspace/zmk-module-runtime-input-processor apply "$GITHUB_WORKSPACE/patches/runtime-temp-layer.patch"
          python3 scripts/test_mouse_lifetimes.py --source /tmp/gridroll-workspace/zmk-module-runtime-input-processor/src/pointing/input_processor_runtime.c
      - name: Observe and test actual battery sampling results
        run: |
          git -C /tmp/gridroll-workspace/zmk apply --check "$GITHUB_WORKSPACE/patches/battery-sample-status.patch"
          git -C /tmp/gridroll-workspace/zmk apply "$GITHUB_WORKSPACE/patches/battery-sample-status.patch"
          python3 scripts/test_battery_status_hook.py --source /tmp/gridroll-workspace/zmk/app/src/battery.c --activity /tmp/gridroll-workspace/zmk/app/src/activity.c
      - name: Enable and test bounded unlocked Studio BLE discovery
        run: |
          git -C /tmp/gridroll-workspace/zmk apply --check "$GITHUB_WORKSPACE/patches/studio-ble-discovery.patch"
          git -C /tmp/gridroll-workspace/zmk apply "$GITHUB_WORKSPACE/patches/studio-ble-discovery.patch"
          python3 scripts/test_studio_ble.py --source /tmp/gridroll-workspace/zmk/app/src/ble.c --uuid /tmp/gridroll-workspace/zmk/app/src/studio/uuid.h
      - name: Build left, right, diagnostic and settings-reset firmware
        run: python3 scripts/build_firmware.py --workspace /tmp/gridroll-workspace --out artifacts
      - name: Prepare three-file firmware package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          names = ("GridRoll-left.uf2", "GridRoll-right.uf2", "GridRoll-settings-reset.uf2")
          target = Path("firmware")
          target.mkdir()
          for name in names:
              shutil.copyfile(Path("artifacts") / name, target / name)
          assert sorted(p.name for p in target.iterdir()) == sorted(names)
          PY
      - name: Upload firmware package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GridRoll-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 30

  bootloader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install locked tooling
        run: |
          python3 -m venv /tmp/gridroll-tools
          /tmp/gridroll-tools/bin/pip install -r ci/requirements.lock
          echo /tmp/gridroll-tools/bin >> "$GITHUB_PATH"
          curl -fLsS --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi.tar.xz -o /tmp/arm-toolchain.tar.xz
          echo '12a2815644318ebcceaf84beabb665d0924b6e79e21048452c5331a56332b309  /tmp/arm-toolchain.tar.xz' | sha256sum --check
          tar -xf /tmp/arm-toolchain.tar.xz -C /tmp
          echo /tmp/arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi/bin >> "$GITHUB_PATH"
      - name: Fetch pinned Adafruit bootloader
        run: |
          git clone --filter=blob:none https://github.com/adafruit/Adafruit_nRF52_Bootloader /tmp/gridroll-bootloader
          git -C /tmp/gridroll-bootloader checkout c67f0bcf0fa8e841426335b1bbde91cda6ca1f50
          git -C /tmp/gridroll-bootloader submodule update --init --depth 1
      - name: Build first-flash package and upstream regression boards
        run: python scripts/build_bootloader.py --source /tmp/gridroll-bootloader --out artifacts
