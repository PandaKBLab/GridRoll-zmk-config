# SPDX-License-Identifier: MIT
description: One discrete wheel step on each press; release does not repeat
compatible: "gridroll,behavior-wheel-step"
include: zero_param.yaml
properties:
  input-code:
    type: int
    required: true
  step:
    type: int
    required: true
    # Devicetree cells encode -1 as unsigned 0xFFFFFFFF; the driver casts int32_t.
    enum: [0xFFFFFFFF, 1]
